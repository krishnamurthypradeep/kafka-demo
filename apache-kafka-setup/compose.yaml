services:

  # ============================================================
  # KAFKA 1
  # ============================================================
  kafka1:
    image: apache/kafka:4.3.1
    container_name: kafka1
    hostname: kafka1
    user: "0"

    ports:
      - "19092:19092"

    environment:
      # --------------------
      # KRaft
      # --------------------
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller

      CLUSTER_ID: 4L6g3nShT-eMCtK--X86sw

      KAFKA_CONTROLLER_QUORUM_VOTERS: >
        1@kafka1:29093,
        2@kafka2:29093,
        3@kafka3:29093

      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER

      # --------------------
      # Listeners
      # --------------------
      KAFKA_LISTENERS: >
        INTERNAL://0.0.0.0:9092,
        EXTERNAL://0.0.0.0:19092,
        CONTROLLER://0.0.0.0:29093

      KAFKA_ADVERTISED_LISTENERS: >
        INTERNAL://kafka1:9092,
        EXTERNAL://localhost:19092

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: >
        INTERNAL:PLAINTEXT,
        EXTERNAL:PLAINTEXT,
        CONTROLLER:PLAINTEXT

      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL

      # --------------------
      # Replication
      # --------------------
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3

      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2

      KAFKA_DEFAULT_REPLICATION_FACTOR: 3
      KAFKA_MIN_INSYNC_REPLICAS: 2

      KAFKA_NUM_PARTITIONS: 3

      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR: 2

      KAFKA_LOG_DIRS: /var/lib/kafka/data

    volumes:
      - kafka1_data:/var/lib/kafka/data


  # ============================================================
  # KAFKA 2
  # ============================================================
  kafka2:
    image: apache/kafka:4.3.1
    container_name: kafka2
    hostname: kafka2
    user: "0"

    ports:
      - "19093:19093"

    environment:
      KAFKA_NODE_ID: 2
      KAFKA_PROCESS_ROLES: broker,controller

      CLUSTER_ID: 4L6g3nShT-eMCtK--X86sw

      KAFKA_CONTROLLER_QUORUM_VOTERS: >
        1@kafka1:29093,
        2@kafka2:29093,
        3@kafka3:29093

      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER

      KAFKA_LISTENERS: >
        INTERNAL://0.0.0.0:9092,
        EXTERNAL://0.0.0.0:19093,
        CONTROLLER://0.0.0.0:29093

      KAFKA_ADVERTISED_LISTENERS: >
        INTERNAL://kafka2:9092,
        EXTERNAL://localhost:19093

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: >
        INTERNAL:PLAINTEXT,
        EXTERNAL:PLAINTEXT,
        CONTROLLER:PLAINTEXT

      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3

      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2

      KAFKA_DEFAULT_REPLICATION_FACTOR: 3
      KAFKA_MIN_INSYNC_REPLICAS: 2

      KAFKA_NUM_PARTITIONS: 3

      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR: 2

      KAFKA_LOG_DIRS: /var/lib/kafka/data

    volumes:
      - kafka2_data:/var/lib/kafka/data


  # ============================================================
  # KAFKA 3
  # ============================================================
  kafka3:
    image: apache/kafka:4.3.1
    container_name: kafka3
    hostname: kafka3
    user: "0"

    ports:
      - "19094:19094"

    environment:
      KAFKA_NODE_ID: 3
      KAFKA_PROCESS_ROLES: broker,controller

      CLUSTER_ID: 4L6g3nShT-eMCtK--X86sw

      KAFKA_CONTROLLER_QUORUM_VOTERS: >
        1@kafka1:29093,
        2@kafka2:29093,
        3@kafka3:29093

      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER

      KAFKA_LISTENERS: >
        INTERNAL://0.0.0.0:9092,
        EXTERNAL://0.0.0.0:19094,
        CONTROLLER://0.0.0.0:29093

      KAFKA_ADVERTISED_LISTENERS: >
        INTERNAL://kafka3:9092,
        EXTERNAL://localhost:19094

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: >
        INTERNAL:PLAINTEXT,
        EXTERNAL:PLAINTEXT,
        CONTROLLER:PLAINTEXT

      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3

      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2

      KAFKA_DEFAULT_REPLICATION_FACTOR: 3
      KAFKA_MIN_INSYNC_REPLICAS: 2

      KAFKA_NUM_PARTITIONS: 3

      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR: 2

      KAFKA_LOG_DIRS: /var/lib/kafka/data

    volumes:
      - kafka3_data:/var/lib/kafka/data


  # ============================================================
  # POSTGRES
  # ============================================================
  postgres:
    image: postgres:15
    container_name: postgres
    user: "0"

    command:
      - postgres
      - -c
      - wal_level=logical

    environment:
      POSTGRES_USER: kafka
      POSTGRES_PASSWORD: kafka
      POSTGRES_DB: kafka_demo

    ports:
      - "5432:5432"

    volumes:
      - pgdata:/var/lib/postgresql/data


  # ============================================================
  # KAFKA CONNECT
  #
  # Replaces:
  # confluentinc/cp-kafka-connect
  # ============================================================
  kafka-connect:
    image: quay.io/debezium/connect:3.6
    container_name: kafka-connect
    hostname: kafka-connect

    ports:
      - "8083:8083"

    environment:
      BOOTSTRAP_SERVERS: kafka1:9092,kafka2:9092,kafka3:9092

      GROUP_ID: kafka-connect-group

      CONFIG_STORAGE_TOPIC: connect-configs
      OFFSET_STORAGE_TOPIC: connect-offsets
      STATUS_STORAGE_TOPIC: connect-status

      CONFIG_STORAGE_REPLICATION_FACTOR: 3
      OFFSET_STORAGE_REPLICATION_FACTOR: 3
      STATUS_STORAGE_REPLICATION_FACTOR: 3

      KEY_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      VALUE_CONVERTER: org.apache.kafka.connect.json.JsonConverter

      CONNECT_KEY_CONVERTER_SCHEMAS_ENABLE: "false"
      CONNECT_VALUE_CONVERTER_SCHEMAS_ENABLE: "false"

      CONNECT_PLUGIN_PATH: /kafka/connect,/kafka/external-plugins

    volumes:
      - ./connect-plugins:/kafka/external-plugins

    depends_on:
      - kafka1
      - kafka2
      - kafka3
      - postgres


  # ============================================================
  # APICURIO SCHEMA REGISTRY
  #
  # Replaces:
  # confluentinc/cp-schema-registry
  #
  # host:
  # http://localhost:8081
  #
  # Confluent compatible API:
  # http://localhost:8081/apis/ccompat/v7
  # ============================================================
  schema-registry:
    image: apicurio/apicurio-registry:latest-release
    container_name: schema-registry

    ports:
      - "8081:8080"

    environment:
      APICURIO_STORAGE_KIND: kafkasql

      APICURIO_KAFKASQL_BOOTSTRAP_SERVERS: >
        kafka1:9092,
        kafka2:9092,
        kafka3:9092

    depends_on:
      - kafka1
      - kafka2
      - kafka3


  # ============================================================
  # KAFKA UI
  # ============================================================
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui

    ports:
      - "8080:8080"

    environment:
      KAFKA_CLUSTERS_0_NAME: local-kafka-4

      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: >
        kafka1:9092,
        kafka2:9092,
        kafka3:9092

      # Apicurio exposes Confluent-compatible Schema Registry API
      KAFKA_CLUSTERS_0_SCHEMAREGISTRY: >
        http://schema-registry:8080/apis/ccompat/v7

      KAFKA_CLUSTERS_0_KAFKACONNECT_0_NAME: kafka-connect
      KAFKA_CLUSTERS_0_KAFKACONNECT_0_ADDRESS: >
        http://kafka-connect:8083

    depends_on:
      - kafka1
      - kafka2
      - kafka3
      - schema-registry
      - kafka-connect


volumes:
  kafka1_data:
  kafka2_data:
  kafka3_data:
  pgdata: