spring:
  application:
    name: kafka-consumer-demo
  kafka:
    bootstrap-servers:
      - localhost:19092
      - localhost:19093
      - localhost:19094
    #template:
    #  default-topic: orders-topic
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.IntegerDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JacksonJsonDeserializer


     # batch-size: 32768
      enable-auto-commit: false
      auto-commit-interval: 5
      auto-offset-reset: latest

      properties:
        spring.json.value.default.type: com.myapp.kafka.domain.Order
        spring.json.trusted.packages: com.myapp.kafka.domain
        spring.json.type.headers: false
      group-id: order-batch-group


    listener:
      type: batch
      ack-mode: batch


server:
  port: 8889