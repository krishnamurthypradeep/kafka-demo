spring:
  application:
    name: kafka-consumer-demo
  kafka:
    bootstrap-servers:
      - localhost:19092
      - localhost:19093
      - localhost:19094
    #template:
    #  default-topic: orders-topic
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.IntegerDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JacksonJsonDeserializer


     # batch-size: 32768
      enable-auto-commit: false

      auto-offset-reset: earliest
      fetch-min-size: 100KB
      fetch-max-wait: 5000
      session-timeout-ms: 10000
      max-partition-fetch-bytes: 1MB

      properties:
        spring.json.value.default.type: com.myapp.kafka.domain.Order
        spring.json.trusted.packages: com.myapp.kafka.domain
        spring.json.type.headers: false
        partition.assignment.strategy: org.apache.kafka.clients.consumer.RangeAssignor

      group-id: manual-commit-v1
      max-poll-records: 10


    listener:
      type: batch
      ack-mode: manual


server:
  port: 0
logging:
  level:
    org.apache.kafka.clients.consumer.ConsumerConfig: INFO